<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Skelett</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />

    <!--Editor settings of this project-->
    <meta type="settings" autoview="Graph|2026-05-04T14:48:34.420Z|71030"
        project="{'name':'Skelett','graphAutoView':'Graph|2026-05-04T14:48:34.420Z|71030'}" />

    <!--Activate the following line to include the FUDGE-version of Oimo-Physics. You may want to download a local copy to work offline and be independent from future changes!-->
    <script type="text/javascript" src="https://Sergej-Tribunski.github.io/FUDGE/Distribution/OimoPhysics.js"></script>

    <!--Load FUDGE. You may want to download local copies to work offline and be independent from future changes! Developers working on FUDGE itself may want to create symlinks-->
    <script type="text/javascript" src="https://Sergej-Tribunski.github.io/FUDGE/Distribution/FudgeCore.js"></script>
    <script type="text/javascript" src="https://Sergej-Tribunski.github.io/FUDGE/Distribution/FudgeAid.js"></script>

    <!--Link internal resources. The editor only loads the first, but at runtime, multiple files can contribute-->
    <link type="resources" src="Internal.json" />

    <!--Load custom scripts-->
    <script type="text/javascript" src="Script/Build/Script.js" editor="true"></script>

    <!--Load Autoview script-->
    <script type="text/javascript" src="Autoview.js"></script>

</head>

<body>
    <!--Dialog shown at startup only-->
    <dialog>
        <p>FUDGE Autoview</p>
        <h1>Title (will be replaced by Autoview)</h1>
        <p>click to start</p>
    </dialog>
    <!--Canvas for FUDGE to render to-->
    <canvas class="fullscreen">
    </canvas>

    <div id="controls" style="display: none;">
        <h3>Movement Controls</h3>
        Click on bones to select. <br>
        Click again to deselect. <br>
        Press 'Escape' to deselect all. <br>

        <label>
            Flex Strength
            <input id="flexStrength" type="number" value="10">
        </label>

        <label>
            Flex Direction
            <select id="flexDirection">
                <option value="1">1</option>
                <option value="-1">-1</option>
            </select>
        </label>

        <label>
            Abduct/Twist Strength
            <input id="abductStrength" type="number" value="10">
        </label>

        <label>
            Abduct/Twist Direction
            <select id="abductDirection">
                <option value="1">1</option>
                <option value="-1">-1</option>
            </select>
        </label>

        <button id="toggleMovement">
            Start Movement
        </button>
    </div>

    <div id="selectedBonesPanel">
        <h3>Selected Bones</h3>
        <ul id="selectedBonesList"></ul>
    </div>

</body>

</html>
